{% extends "base.html" %}

{% block title %}تسجيل الدخول | {{ platform_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-xl emerald-gradient text-white flex items-center justify-center font-bold text-2xl mx-auto mb-3 shadow">
                و
            </div>
            <h2 class="text-2xl font-black text-slate-900">تسجيل الدخول</h2>
            <p class="text-xs text-slate-500 mt-1">أدخل بيانات حسابك الموثق بالمنصة</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="user@example.dz"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-waqf-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-waqf-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-waqf-700 hover:bg-waqf-800 text-white font-bold py-3 rounded-xl transition text-sm shadow-md">
                دخول إلى لوحة التحكم
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-200">
            <span class="text-xs font-bold text-slate-600 block mb-3 text-center">أو الدخول السريع بأحد الحسابات النموذجية المعتمدة:</span>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="quickLogin('waqif@waqftech.dz', 'waqif123456', '/dashboard/waqif')"
                        class="p-2.5 rounded-lg border border-emerald-300 bg-emerald-50 text-emerald-900 hover:bg-emerald-100 font-bold text-right transition">
                    👤 حساب الواقف
                    <span class="block text-[10px] text-emerald-700 font-normal">إيداع وشروط الوقف</span>
                </button>
                <button onclick="quickLogin('funder@waqftech.dz', 'funder123456', '/dashboard/funder')"
                        class="p-2.5 rounded-lg border border-blue-300 bg-blue-50 text-blue-900 hover:bg-blue-100 font-bold text-right transition">
                    💼 حساب الممول
                    <span class="block text-[10px] text-blue-700 font-normal">استثمار بالصيغ السبع</span>
                </button>
                <button onclick="quickLogin('entrepreneur@waqftech.dz', 'owner123456', '/dashboard/project')"
                        class="p-2.5 rounded-lg border border-purple-300 bg-purple-50 text-purple-900 hover:bg-purple-100 font-bold text-right transition">
                    🏗️ صاحب مشروع
                    <span class="block text-[10px] text-purple-700 font-normal">طلب تمويل وإنجاز</span>
                </button>
                <button onclick="quickLogin('sharia@waqftech.dz', 'sharia123456', '/dashboard/sharia')"
                        class="p-2.5 rounded-lg border border-amber-300 bg-amber-50 text-amber-900 hover:bg-amber-100 font-bold text-right transition">
                    📜 الهيئة الشرعية
                    <span class="block text-[10px] text-amber-700 font-normal">الفحص والرقابة والفتوى</span>
                </button>
                <button onclick="quickLogin('admin@waqftech.dz', 'admin123456', '/dashboard/admin')"
                        class="p-2.5 rounded-lg border border-slate-400 bg-slate-100 text-slate-900 hover:bg-slate-200 font-bold text-right col-span-2 transition">
                    ⚙️ ناظر الوقف (إدارة المنصة والتدقيق المالي)
                </button>
            </div>
        </div>

        <div class="mt-6 text-center text-xs text-slate-500">
            ليس لديك حساب بعد؟ <a href="/register" class="text-waqf-700 font-bold hover:underline">سجل حساباً جديداً الآن</a>
        </div>
    </div>
</div>

<script>
    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        await performLogin(email, password, "/dashboard/waqif");
    }

    async function quickLogin(email, password, defaultRedirect) {
        await performLogin(email, password, defaultRedirect);
    }

    async function performLogin(email, password, defaultRedirect) {
        try {
            const res = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "فشل تسجيل الدخول");

            localStorage.setItem("waqf_token", data.access_token);
            localStorage.setItem("waqf_user", JSON.stringify(data.user));

            window.location.href = defaultRedirect;
        } catch (err) {
            alert(err.message);
        }
    }
</script>
{% endblock %}
